name: dev-ai Pre-release

on:
  push:
    branches:
      - dev-ai

permissions:
  contents: write

concurrency:
  group: dev-ai-prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prerelease:
    if: github.ref == 'refs/heads/dev-ai'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      - name: Prepare pre-release
        id: version
        run: |
          version="$(node -p "require('./komari-theme.json').version")"
          echo "name=v${version} dev" >> "$GITHUB_OUTPUT"
          mv komari-theme-Glassmorphism-build-*.zip komari-theme-Glassmorphism-dev.zip

      - name: Point dev-ai tag to this build
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo
            const ref = 'tags/dev-ai'
            try {
              await github.rest.git.getRef({ owner, repo, ref })
              await github.rest.git.updateRef({ owner, repo, ref, sha: context.sha, force: true })
            } catch (error) {
              if (error.status !== 404) throw error
              await github.rest.git.createRef({ owner, repo, ref: `refs/${ref}`, sha: context.sha })
            }

      - name: Create dev-ai pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dev-ai
          name: ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: '開發版 commit: ${{ github.sha }}'
          overwrite_files: true
          fail_on_unmatched_files: true
          files: komari-theme-Glassmorphism-dev.zip
